title: "Build\nBridge"
tooltip: "Model the bridge a saved Bridge Builder design describes: reads the newest bridge_*.json in Downloads (or lets you pick one), reads the four posts again, and places the sloped deck floor inside them, the two trusses on the post faces, the cross beams and bracing with their tops on the floor underside, the deck stiffeners hosted on the floor and the railings along the deck edges, in one undo step. Everything is tracked by bridge name for Update Bridges; building a name again replaces it."
