title: "Build\nBridge"
tooltip: "Model the bridge a saved Bridge Builder design describes: reads the newest bridge_*.json in Downloads (or lets you pick one), finds the two end points and their deck levels, and places the sloped deck floor, the two trusses, the cross beams and the plan bracing as structural framing in one undo step. The elements are tracked by bridge name so Update Bridges can re-align them later. Building a bridge that exists again replaces it."
