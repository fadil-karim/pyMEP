title: "Update\nBridges"
tooltip: "Re-align built bridges to where their posts are now: reads each tracked bridge's four posts again, moves the trusses, cross beams and bracing onto their new lines (keeping the element ids) and moves the deck with its stiffeners and railings - or rebuilds the deck, stiffeners and railings when the span, width, height or fall changed. One undo step per bridge."
