title: "Bridge\nBuilder"
tooltip: "Design a steel truss footbridge between two pairs of posts: pick the two posts at the start and the two at the end (vertical framing or columns already in the model) and the builder opens in your browser with the span, width, levels and post height filled in - choose the truss type, panels, height, chord pieces, deck, plan bays, bracing, stiffeners, railing and member types, then save the design. Build Bridge models it; Update Bridges re-aligns it when the posts move."
