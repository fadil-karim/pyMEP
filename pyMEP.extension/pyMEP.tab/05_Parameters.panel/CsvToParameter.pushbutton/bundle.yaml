title: "CSV to\nParameter"
tooltip: "Set one instance parameter on every element of a category from a CSV file: pick the category, the CSV, the element parameter and CSV column that identify each element (Mark against a Mark column), then the parameter to set and the column with its new values (Peak Load from a Peak Load column). Numbers are read in the parameter's project units. The dialog counts the matches live; Preview in browser lists every element with its current and new value, the CSV rows no element claimed and duplicate keys; Apply writes in one undo step and reports what changed."
