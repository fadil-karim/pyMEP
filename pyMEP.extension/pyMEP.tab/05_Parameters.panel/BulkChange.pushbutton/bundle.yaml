title: "Bulk\nChange"
tooltip: "Change a parameter on many elements at once, like a spreadsheet: filter by category, family and type (or keep to the Revit selection), tick the parameters to show as columns, select cells in one column - click, Shift+click, drag or Ctrl+click - type the new value and press Change. Instance and type parameters; numbers read in project units; each Change is one undo step."
