title: "Bulk\nChange"
tooltip: "Change a parameter on many elements at once, like a spreadsheet: pick an existing schedule - its elements are the rows and its fields the columns - or filter by category, family and type instead; either can keep to the Revit selection. Tick more parameters to add columns, sort by any column, filter rows by column values, select cells in one column - click, Shift+click, drag or Ctrl+click - type the new value and press Change. Instance and type parameters; numbers read in project units; each Change is one undo step."
