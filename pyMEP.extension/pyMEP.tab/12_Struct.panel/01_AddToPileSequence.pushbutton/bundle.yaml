title: "Add to Pile\nSequence"
tooltip: "Close missing numbers in a pile mark sequence: type the missing numbers (1605, 1606 or P1605-P1608) and every pile above them moves down to fill them - P1607 becomes P1605, P1608 becomes P1606 and so on - keeping prefix and zero padding; the old top numbers come free for new piles. One set (leading digit) at a time. Preview in browser shows the table and a plan of the piles with renames, duplicates and gaps highlighted; a tick gives duplicates -1, -2 suffixes; Apply renames in one undo step. Marks with a suffix such as -1 are left alone."
